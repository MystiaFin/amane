[package]
name = "amane"
version = "0.1.0"
edition = "2024"

[lib]
name = "amane"
path = "src/lib.rs"

[dependencies]
smithay-client-toolkit = { version = "0.21.1", default-features = false, features = ["calloop", "xkbcommon"] }
thiserror = "2"
vello = "0.10.0"
tempfile = "3"
wayland-client = "0.31.15"
wayland-backend = { version = "0.3.17", features = ["client_system"] }
wayland-protocols-wlr = { version = "=0.3.12", features = ["client"] }
fontdue = "0.9.4"
fontconfig = "0.11"
ttf-parser = "0.25.1"
zune-jpeg = "0.5.15"
png = "0.18.1"
inotify = { version = "0.11.5", default-features = false }
serde_json = "1.0.151"

[dev-dependencies]
chrono = "0.4"

[workspace]
members = ["cli"]
