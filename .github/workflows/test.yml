name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # the flake's dev shell already lists every library amane links
      - uses: cachix/install-nix-action@v31

      # only the library tests, they run without a compositor
      - run: nix develop -c cargo test --lib
